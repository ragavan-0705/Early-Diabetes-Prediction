<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Animate.css -->
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

<div class="form-container">
    <h2>Signup</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <div class="password-wrapper">
            <input type="password" name="password" placeholder="Password" required>
            <button type="button" class="toggle-password" aria-label="Show password">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
        <button type="submit">Signup</button>
    </form>
    <a href="/login">Already have an account?</a>
</div>

<!-- ✅ FLASH DATA (HTML ONLY) -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div id="flash-data"
     data-category="{{ messages[0][0] }}"
     data-message="{{ messages[0][1] }}">
</div>
{% endif %}
{% endwith %}

<!-- ✅ PURE JAVASCRIPT (NO JINJA INSIDE) -->
<script>
    const flashBox = document.getElementById("flash-data");
    if (flashBox) {
        const category = flashBox.dataset.category;
        const message = flashBox.dataset.message;

        Swal.fire({
            icon: category === "success" ? "success" : "error",
            title: category === "success" ? "Success" : "Oops!",
            text: message,
            showClass: {
                popup: 'animate__animated animate__shakeX'
            }
        });
    }
</script>
</script>

<!-- Password toggle script -->
<script>
    (function () {
        const eye = {
            open: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
            closed: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.56 20.56 0 0 1 5-5.94"></path><path d="M1 1l22 22"></path></svg>'
        };

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const wrapper = btn.closest('.password-wrapper');
                if (!wrapper) return;
                const input = wrapper.querySelector('input[type="password"], input[type="text"]');
                if (!input) return;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = eye.closed;
                    btn.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    btn.innerHTML = eye.open;
                    btn.setAttribute('aria-label', 'Show password');
                }
            });
        });
    })();
</script>
</body>
</html>
